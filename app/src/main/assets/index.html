<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<title>5/3/1 Training</title>
<style>
:root{--bg:#0a0a0c;--s1:#141417;--s2:#1d1d22;--line:#27272d;--tx:#f2f2f4;--mu:#8b8b95;--ac:#c6f432;--bad:#ff6a5f;--ink:#0a0a0c;--nav:rgba(20,20,23,.92);--hud:rgba(20,20,23,.96);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;min-height:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--tx)}
#app{max-width:480px;margin:0 auto;padding:20px 16px calc(108px + env(safe-area-inset-bottom,0px))}
.mu{color:var(--mu)}
h1{font-size:30px;margin:2px 0 0;letter-spacing:-.02em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin:28px 0 10px;font-weight:600}
.sm{font-size:13px}
/* home */
.chips{display:flex;gap:8px;margin:18px 0 6px}
.chip{position:relative;flex:1;padding:10px 0;border-radius:12px;background:var(--s1);border:1px solid var(--line);text-align:center;font-size:13px;color:var(--mu)}
.chip b{display:block;font-size:17px;color:var(--tx)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.chip.on b{color:var(--ink)}
.wkdot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--ac);pointer-events:none}
.chip.on .wkdot{background:var(--ink)}
.lift{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:18px;margin-top:10px;background:var(--s1);border:1px solid var(--line);border-radius:18px}
.lift .n{font-weight:600;font-size:18px}
.lift .r{text-align:right}
.lift .r b{font-size:18px}
.lift .r.done{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.lift .r .ms{font-size:16px;letter-spacing:-.02em}
.early{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:16px;border-radius:16px;background:var(--s1);border:1px solid var(--ac);font-weight:700;font-size:17px}
.early.arm{border-color:var(--bad);color:var(--bad)}
.early.arm .dot{background:var(--bad)}
.hud .early{margin-top:0}
.wtop .early{width:auto;flex:none;margin:0;padding:7px 10px;font-size:12px;border-radius:999px;white-space:nowrap;gap:6px}
.wtop .early .dot{width:16px;height:16px;line-height:16px;font-size:10px}
.lift.ok{opacity:.55}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--ac);color:var(--ink);text-align:center;line-height:22px;font-size:13px;font-weight:700}
.link{display:block;width:100%;margin-top:22px;padding:14px;border-radius:14px;border:1px dashed var(--line);color:var(--mu)}
.link.arm{border-color:var(--ac);color:var(--ac)}
/* nav */
nav{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 20px);max-width:440px;display:flex;gap:4px;padding:6px;background:var(--nav);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 28px rgba(0,0,0,.28);backdrop-filter:blur(18px);z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;padding:8px 2px;border-radius:18px;color:var(--mu);font-weight:600;font-size:11px;line-height:1;letter-spacing:.01em}
nav button svg{width:20px;height:20px;display:block}
nav button.on{background:var(--ac);color:var(--ink)}
/* settings */
.box{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row input[type=number],.row input[type=text]{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:96px;text-align:right;outline:0}
.row input[type=text]{width:100%;text-align:left}
.row input:focus{border-color:var(--ac)}
.row .tm{font-size:12px;color:var(--mu);display:block}
.tcard{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px 14px 14px;margin-top:10px}
.tcard h3{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.lnm{display:flex;align-items:center;gap:8px;min-width:0}
.lnm>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:11px;background:var(--bg);border:1px solid var(--line);color:var(--ac)}
.logo svg{width:22px;height:22px;display:block}
.tcard h3 em{font-style:normal;font-size:13px;font-weight:600;color:var(--mu)}
.tcard h3 em.up{color:var(--ac)}
.wks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.prevtm{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:14px;font-size:13px;font-weight:600;color:var(--mu)}
.prevtm b{color:var(--tx);font-size:15px;font-weight:700;letter-spacing:-.02em}
.tw{background:var(--s2);border-radius:14px;padding:10px 6px 8px;text-align:center;min-width:0}
.tw span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600;white-space:nowrap}
.tw b{display:block;margin-top:6px;font-size:15px;letter-spacing:-.03em;font-weight:700;white-space:nowrap}
.tw i{display:block;margin-top:2px;font-style:normal;font-size:12px;font-weight:700;color:var(--mu)}
.tw.hit b,.tw.hit i{color:var(--ac)}
.tw.bad b,.tw.bad i{color:var(--bad)}
.tw.none b{color:var(--mu);font-weight:500}
.stepper{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.stepper .stp{width:48px;height:48px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:28px;line-height:1}
.stepper label{display:flex;align-items:baseline;gap:4px}
.stepper input{width:128px;background:transparent;border:0;border-bottom:2px solid var(--line);font-size:34px;font-weight:700;text-align:right;letter-spacing:-.04em;outline:0;padding:0 0 2px;-moz-appearance:textfield;appearance:textfield}
.stepper input:focus{border-bottom-color:var(--ac)}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper small{font-size:15px;color:var(--mu);font-weight:600}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;margin:12px 0;gap:3px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--ac);color:var(--ink);font-weight:600}
.picks{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.picks button{padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);color:var(--mu);font-size:14px}
.picks button.on{background:var(--ac);border-color:var(--ac);color:var(--ink);font-weight:600}
.themes{display:flex;flex-wrap:wrap;gap:8px}
.themes button{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:999px;background:var(--s1);border:1px solid var(--line);color:var(--mu);font-size:14px;font-weight:600}
.themes button.on{border-color:var(--ac);color:var(--tx);background:var(--s2)}
.themes i{width:12px;height:12px;border-radius:50%;display:block}
select.pick{display:block;width:100%;margin:8px 0 12px;padding:12px;border-radius:12px;background:var(--s2);color:var(--tx);border:1px solid var(--line);font:inherit}
.how{font-size:13px;color:var(--mu);background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 8px;line-height:1.45}
.how b{color:var(--tx)}
.sch{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.sch .ln{display:flex;gap:8px;align-items:flex-start}
.sch .ln>span:first-child{width:42px;flex:none;padding-top:5px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--mu)}
.sch .sets{display:flex;flex-wrap:wrap;gap:6px}
.sch .sets b{font-size:13px;font-weight:600;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:4px 8px}
.sch .sets b.off{color:var(--mu);font-weight:500}
.chk{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:transparent;font-size:20px;font-weight:700}
.chk.on{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.acc{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
.acc:last-child{border:0}
.acc span{display:block;font-size:13px;color:var(--mu);margin-bottom:6px}
.danger{color:var(--bad)}
.aday{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:10px}
.aday h3{margin:0;font-size:17px}
.aday .sub{font-size:12px;color:var(--mu);margin:2px 0 4px}
.ax{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.axnm{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;text-align:left}
.axnm:focus,.axm input:focus{border-color:var(--ac)}
.axm{display:grid;grid-template-columns:1fr 1fr 1fr 42px;gap:8px;margin-top:8px;align-items:end}
.axm label{font-size:11px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.axm input{width:100%;display:block;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;outline:0}
.axx{height:42px;border-radius:12px;border:1px solid var(--line);color:var(--bad);font-size:18px}
.addax{display:block;width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px dashed var(--line);color:var(--mu);font-size:14px}
.dayh{display:flex;gap:8px;align-items:center}
.dayh .axnm{flex:1;width:auto}
.dayh .axx{width:42px;flex:none}
/* workout */
.wtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:4;background:var(--bg);padding:4px 0 8px}
.back{width:42px;height:42px;border-radius:50%;background:var(--s1);border:1px solid var(--line);font-size:18px}
.wt{flex:1;min-width:0}.wt b{display:block;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-size:15px;color:var(--mu);background:var(--s1);border:1px solid var(--line);padding:8px 12px;border-radius:20px}
.prog{height:4px;background:var(--s1);border-radius:4px;margin:16px 0 18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);transition:width .4s}
.card{border-radius:20px;background:var(--s1);border:1px solid var(--line);margin-bottom:10px}
.card.done{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;color:var(--mu);font-size:15px}
.card.done b{color:var(--tx);font-weight:600}
.card.done.fail{border-color:rgba(255,106,95,.4)}
.card.done.fail .res{color:var(--bad)}
.card.done .res{color:var(--ac);font-weight:700}
.card.done.last,.card.done[data-a]{cursor:pointer}
.card.done>span:first-child{min-width:0}
.card.done .ed{flex:none;margin-left:8px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);color:var(--tx);font-size:12px;font-weight:700}
.card.done.edit{display:block;color:var(--tx)}
.etag{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mu)}
.etag button{color:var(--mu);font-size:13px;font-weight:600}
.erow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:14px}
.estep{display:flex;align-items:center;gap:8px}
.estep b{min-width:72px;text-align:center}
.estep button{min-width:36px;height:36px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.estep button.on{background:var(--ac);color:var(--ink);border-color:var(--ac)}
.card.done.edit .btn{margin-top:14px;padding:12px;font-size:16px}
.ip{color:var(--ac);font-weight:700}
.card.cur{padding:22px 20px 20px;border-color:#3a3a42;background:var(--s2)}
.card.enter{animation:up .5s cubic-bezier(.2,.9,.25,1) both}
@keyframes up{from{transform:translateY(70vh);opacity:0}to{transform:none;opacity:1}}
.tag{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--ac);font-weight:600}
.big{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:8px}
.big small{font-size:22px;font-weight:500;color:var(--mu);margin-left:6px;letter-spacing:0}
.reps{font-size:28px;color:var(--mu);margin:2px 0 20px}
.hint{font-size:13px;color:var(--mu);margin:-10px 0 14px}
.btn{display:block;width:100%;padding:18px;border-radius:16px;font-weight:700;font-size:18px;text-align:center}
.btn.ok{background:var(--ac);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mu);margin-top:10px;font-weight:500;font-size:16px;padding:14px}
.step{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.step button{width:68px;height:68px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:30px}
.step div{text-align:center}
.step b{font-size:48px;display:block;line-height:1}
.step span{font-size:12px;color:var(--mu)}
.next{text-align:center;font-size:13px;color:var(--mu);margin:14px 0 6px}
.fin{padding:26px 20px;text-align:center}
.fin h3{margin:0 0 6px;font-size:26px}
.fin p{color:var(--mu);margin:4px 0}
.fin .btn{margin-top:20px}

.cy{background:var(--s1);border:1px solid var(--line);border-radius:18px;margin-top:10px;overflow:hidden}
.cy>button{display:flex;width:100%;text-align:left;align-items:center;gap:12px;padding:14px 16px}
.cy .ct{flex:1;min-width:0}
.cy .ct b{display:block;font-size:17px}
.cy .ch{width:28px;height:28px;border-radius:50%;background:var(--s2);border:1px solid var(--line);color:var(--mu);line-height:28px;text-align:center;flex:none}
.cy.on .ch{background:var(--ac);border-color:var(--ac);color:var(--ink);font-weight:700}
.pill{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--ac);border-radius:999px;padding:2px 7px;vertical-align:2px}
.cyb{border-top:1px solid var(--line);padding:12px}
.lbs{display:flex;flex-direction:column;gap:8px}
.lb{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px}
.lbh{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lbn{font-weight:600;font-size:16px}
.lbb{font-size:16px;font-weight:700;letter-spacing:-.02em;text-align:right}
.wk{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:8px;font-size:13px;color:var(--mu)}
.wk span:first-child{flex:none}
.wsets{color:var(--tx);font-size:14px;font-weight:600;letter-spacing:-.02em;line-height:1.35;text-align:right}
.acts{margin:16px 0 4px}
.acts .link{margin-top:10px;text-align:center;cursor:pointer}
.acts .link:first-child{margin-top:0}
#csvfile{position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0}
.note{font-size:13px;color:var(--mu);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.note b{color:var(--tx)}
.wc{display:flex;align-items:center;justify-content:space-between;margin:10px 0 2px}
.wc button{width:52px;height:52px;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:26px}
.wv{display:flex;align-items:baseline;justify-content:center;flex:1}
.wv input{width:150px;background:transparent;border:0;border-bottom:1px dashed var(--line);font-size:56px;font-weight:700;text-align:center;letter-spacing:-.03em;outline:0;padding:0}
.wv input:focus{border-color:var(--ac)}
.wv small{font-size:20px;color:var(--mu);margin-left:4px}
.wv.lock{justify-content:center}
.wv.lock b{font-size:56px;font-weight:700;letter-spacing:-.03em}
.reps small{font-size:14px}
.btn2{display:flex;gap:10px;margin-top:10px}
.btn2 .btn{margin:0}
.addcard{margin-top:14px}
.addcard .btn{margin-top:12px;padding:14px;font-size:16px}
.chs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.chs button{flex:none;padding:9px 14px;border-radius:20px;background:var(--s1);border:1px solid var(--line);color:var(--mu);font-size:14px;white-space:nowrap}
.chs button.on{background:var(--ac);border-color:var(--ac);color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.st{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.st .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:600}
.st .n{font-size:22px;font-weight:700;letter-spacing:-.03em;margin-top:4px;line-height:1.15}
.st .s{font-size:12px;color:var(--mu);margin-top:2px}
.pc{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:18px 16px 12px;margin-top:12px}
.pc .v{font-size:40px;font-weight:700;letter-spacing:-.03em}
.pc .v small{font-size:16px;color:var(--mu);font-weight:500}
.up{color:var(--ac)}.dn{color:var(--bad)}
.pc svg{width:100%;height:auto;display:block;margin-top:8px}
.pc .seg{margin:10px 0 0}
.hr{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.hr:last-child{border:0}
.hr span:last-child{text-align:right;color:var(--mu)}
.nt{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--ac);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px}
.nt button{color:var(--ac);font-weight:600}

@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
#app.w{padding-bottom:210px}
#app.w.add{padding-bottom:480px}
.card.cur{position:relative;overflow:hidden;padding-top:26px}
.card.cur .tag{display:flex;justify-content:space-between}
.rt{color:var(--mu);font-weight:500;letter-spacing:0;text-transform:none;font-size:13px}
.rt.rdy{color:var(--ac);font-weight:700}
.rl{position:absolute;left:0;right:0;top:0;height:5px;background:var(--line)}
.rl i{display:block;height:100%;width:0;background:var(--ac);transition:width 1s linear}
.card.up{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;opacity:.5;font-size:15px;color:var(--mu)}
.card.up b{color:var(--tx);font-weight:600}
.hud{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--hud);backdrop-filter:blur(14px);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.hi{display:flex;justify-content:space-between;width:100%;text-align:left;font-size:14px;color:var(--mu);padding:2px 2px 10px}
.hi b{color:var(--ac);font-weight:600;margin-right:8px}
.hi span{color:var(--tx)}
.hb{display:flex;gap:8px;align-items:center}
.hg{padding:15px 12px;border:1px solid var(--line);border-radius:14px;color:var(--mu);font-size:14px}
.hok{flex:1;padding:16px;font-size:17px}
.hs{width:52px;height:52px;flex:none;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:26px}
.hn{min-width:48px;text-align:center;font-size:30px;font-weight:700}
html.neo{--shadow:4px 4px 0 0 #000}
html.neo body{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:500}

<script>
const LIFTS=[{id:'squat',n:'Squat',low:1},{id:'bench',n:'Bench press'},{id:'dead',n:'Deadlift',low:1},{id:'ohp',n:'Overhead press'}];
function logoSvg(d){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`}
const LIFT_LOGO={
 squat:logoSvg('<circle cx="8" cy="9.6" r="2.3"/><circle cx="15.6" cy="5" r="1.45" fill="currentColor" stroke="none"/><path d="M8 9.6h4.2M14.8 6.1 12.8 8.6 9.4 15.2 15.4 14.4 14.2 20.8M12.8 20.8h5.2"/>'),
 bench:logoSvg('<circle cx="9.1" cy="6.5" r="2.15"/><circle cx="4.6" cy="12.6" r="1.55" fill="currentColor" stroke="none"/><path d="M6.1 13.4h7M8 13.2 8 8.6M10.4 13.2 10.2 8.6M13.1 13.4 17.4 16.2 16.4 20.6M14.8 20.6h3.6M4.2 16.8v3.4M12.2 16.8v3.4"/><rect x="2.2" y="15.2" width="12" height="1.7" rx="0.7" fill="currentColor" stroke="none"/>'),
 dead:logoSvg('<circle cx="17.5" cy="8.4" r="1.35" fill="currentColor" stroke="none"/><path d="M16.4 9.2 16 10.2 8 13.4 12.6 16.8 12.1 21M10.4 21h6.6M16 10.4 16.7 18.6"/><circle cx="16.7" cy="18.6" r="2.4"/>'),
 ohp:logoSvg('<circle cx="12" cy="9.5" r="1.45" fill="currentColor" stroke="none"/><path d="M12 11.1v4.6M12 15.7 9.1 20.6M12 15.7l2.9 4.9M12 12.5 8.9 7.2M12 12.5l3.1-5.3M6.2 6.2h11.6M6.2 4.5v3.4M17.8 4.5v3.4"/>')
};
function liftLogo(id){const svg=LIFT_LOGO[id];return svg?`<span class="logo">${svg}</span>`:''}
const WEEKS={1:[[65,5],[75,5],[85,5]],2:[[70,3],[80,3],[90,3]],3:[[75,5],[85,3],[95,1]],4:[[40,5],[50,5],[60,5]]};
const WN={1:'3×5',2:'3×3',3:'5/3/1',4:'Deload'};
const KEY='f531v1';
function neon(n,ac){return {n,bg:'#0a0a0c',s1:'#141417',s2:'#1d1d22',line:'#27272d',tx:'#f2f2f4',mu:'#8b8b95',ac,bad:'#ff6a5f',ink:'#0a0a0c',nav:'rgba(20,20,23,.92)',hud:'rgba(20,20,23,.96)'}}
const THEMES={
 lime:neon('Lime','#c6f432'),
 yellow:neon('Yellow','#f2e435'),
 orange:neon('Orange','#ff9f1a'),
 coral:neon('Coral','#ff7a45'),
 pink:neon('Pink','#ff4f9a'),
 magenta:neon('Magenta','#ff4df2'),
 cyan:neon('Cyan','#2eebff'),
 mint:neon('Mint','#3dffb0'),
 blue:neon('Blue','#5eb0ff'),
 ice:{n:'Ice',bg:'#071018',s1:'#0e1a26',s2:'#152433',line:'#243648',tx:'#e8f4fb',mu:'#8aa0b3',ac:'#3ee0ff',bad:'#ff6b8a',ink:'#04141c',nav:'rgba(7,16,24,.92)',hud:'rgba(7,16,24,.96)'},
 amber:{n:'Amber',bg:'#110e09',s1:'#1c1710',s2:'#282116',line:'#3d3424',tx:'#f7f1e6',mu:'#aa987e',ac:'#f0a202',bad:'#ff6a5f',ink:'#1a1203',nav:'rgba(22,18,12,.92)',hud:'rgba(22,18,12,.96)'},
 violet:{n:'Violet',bg:'#0c0a12',s1:'#161222',s2:'#211a31',line:'#332846',tx:'#f4eefe',mu:'#9d92b0',ac:'#c084fc',bad:'#fb7185',ink:'#160818',nav:'rgba(14,10,20,.92)',hud:'rgba(14,10,20,.96)'},
 paper:{n:'Paper',bg:'#f3efe6',s1:'#fffdf8',s2:'#e8e2d6',line:'#ddd4c4',tx:'#1c1914',mu:'#6e665c',ac:'#1f7a4d',bad:'#c44536',ink:'#f7f4ee',nav:'rgba(255,253,248,.94)',hud:'rgba(255,253,248,.97)'}
};
function themeId(){return THEMES[S.theme]?S.theme:'lime'}
const NEO={bg:'#dcebfe',s1:'#dcebfe',s2:'#ffffff',line:'#000000',tx:'#000000',mu:'#000000',ac:'#5294ff',bad:'#ff4d50',ink:'#000000',nav:'#dcebfe',hud:'#dcebfe'};
function applyTheme(){
 const t=S.neo?NEO:THEMES[themeId()];
 const root=document.documentElement;
 root.classList.toggle('neo',!!S.neo);
 ['bg','s1','s2','line','tx','mu','ac','bad','ink','nav','hud'].forEach(k=>root.style.setProperty('--'+k,t[k]));
 const m=document.querySelector('meta[name="theme-color"]');
 if(m)m.setAttribute('content',t.bg);
}
const DEF={rm:{squat:140,bench:100,dead:180,ohp:60},bump:{squat:0,bench:0,dead:0,ohp:0},tmPct:90,step:2.5,supp:'bbb',main:'std',warm:true,theme:'lime',neo:false,
 acc:{squat:[{name:'Lunges',sets:2,lo:6,hi:10},{name:'Plank',sets:2,lo:6,hi:10}],bench:[{name:'Pull-ups',sets:3,lo:6,hi:10},{name:'Chin-ups',sets:2,lo:6,hi:10}],dead:[{name:'Back extensions',sets:3,lo:8,hi:12},{name:'Leg raises',sets:2,lo:8,hi:12}],ohp:[{name:'Pull-ups',sets:3,lo:6,hi:10},{name:'Dips',sets:3,lo:6,hi:10}]},
 rest:2,prog:'cycle',pv3:1,jk:'off',jkStep:5,jkReps:3,jkWk:'3',jkRepMode:'week',jkMax:3,pro5:false,topX:false,dyn:false,jkPair:false,hiDel:false,noSupp4:false,incU:2.5,incL:5,cycle:1,week:1,done:{},workout:null,hist:[],cycles:[],days:[],note:''};
let S=load();
applyTheme();
function exName(s){const t=String(s||'').trim().replace(/\s+/g,' ');if(!t)return '';return t.charAt(0).toLocaleUpperCase('hr')+t.slice(1).toLocaleLowerCase('hr')}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){if(!j.pv3){j.prog='cycle';j.pv3=1}const s=Object.assign(JSON.parse(JSON.stringify(DEF)),j);s.acc=normAcc(j.acc);s.days=normDays(j.days);if(!Array.isArray(s.cycles))s.cycles=[];return s}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function normAcc(acc){
 const d=JSON.parse(JSON.stringify(DEF.acc)),out={};
 LIFTS.forEach(L=>{
  const raw=acc&&acc[L.id];
  if(Array.isArray(raw))out[L.id]=raw.map(x=>{
   if(typeof x==='string')return{name:exName(x),sets:2,lo:6,hi:10};
   const lo=Math.max(1,Math.round(+x.lo||6));
   return{name:exName(x.name),sets:Math.max(1,Math.round(+x.sets||2)),lo,hi:Math.max(lo,Math.round(+x.hi||10))};
  }).filter(x=>x.name);
  else if(typeof raw==='string')out[L.id]=raw.split(',').map(s=>exName(s)).filter(Boolean).map(name=>({name,sets:2,lo:6,hi:10}));
  else out[L.id]=d[L.id];
 });
 return out;
}
function freshId(seen){
 let id;
 do{id='d'+Math.random().toString(36).slice(2,10)}while(seen.has(id)||LIFTS.some(L=>L.id===id));
 return id;
}
function normExList(raw){
 if(!Array.isArray(raw))return [];
 return raw.map(x=>{
  if(typeof x==='string')return{name:exName(x),sets:2,lo:6,hi:10};
  if(!x||typeof x!=='object')return null;
  const lo=Math.max(1,Math.round(+x.lo||6));
  return{name:exName(x.name),sets:Math.max(1,Math.round(+x.sets||2)),lo,hi:Math.max(lo,Math.round(+x.hi||10))};
 }).filter(x=>x&&x.name);
}
function normDays(days){
 if(!Array.isArray(days))return [];
 const seen=new Set(),out=[];
 days.forEach(d=>{
  if(!d||typeof d!=='object')return;
  let id=String(d.id==null?'':d.id).trim();
  if(!id||seen.has(id)||LIFTS.some(L=>L.id===id))id=freshId(seen);
  seen.add(id);
  out.push({id,name:String(d.name==null?'':d.name).trim().replace(/\s+/g,' '),ex:normExList(d.ex)});
 });
 return out;
}
function dayById(id){return (S.days||[]).find(d=>d&&d.id===id)||null}
function dayTitle(id){const d=dayById(id);const n=d&&String(d.name||'').trim();return n||'Extra day'}
function isLiftId(id){return LIFTS.some(L=>L.id===id)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const fmt=n=>String(+(+n).toFixed(2));
const esc=x=>String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const tm=l=>S.rm[l]*S.tmPct/100+S.bump[l];
const wt=(l,p)=>{const st=+S.step||2.5;return Math.round(tm(l)*p/100/st)*st};
const lname=id=>{const L=LIFTS.find(x=>x.id===id);return L?L.n:dayTitle(id)};
const dt=t=>{const d=new Date(t);return d.getDate()+'.'+(d.getMonth()+1)+'.'};
const no=c=>c.n+(c.of?'/'+c.of:'');
const e1=(w,r)=>r<=1?w:w*(1+r/30);
let view='home',armed=null,ui={i:-1},edit=null,enter=false,ensure=false,jumpF=false,buzzed=false,adding=false,openCy=null,ioMsg='',pv={ex:'total',m:'e1'};

function arm(k){if(armed===k)return true;armed=k;render();setTimeout(()=>{if(armed===k){armed=null;render()}},3000);return false}

/* ---------- history helpers ---------- */
function sessE1(s){let m=0;s.sets.forEach(c=>{if(c.k==='main'&&c.r>0&&c.w>0)m=Math.max(m,e1(c.w,c.r))});return m?Math.round(m*10)/10:null}
function mainPrev(l){const h=S.hist.filter(s=>s.lift===l&&s.week!==4&&!s.partial&&sessE1(s));const s=[...h].reverse().find(x=>x.week===S.week)||h[h.length-1];return s?sessE1(s):null}
function lastAcc(key){for(let i=S.hist.length-1;i>=0;i--){if(S.hist[i].partial)continue;const g=S.hist[i].sets.filter(c=>c.k==='acc'&&c.label.toLowerCase()===key&&c.r!=null);if(g.length)return g}return null}
function accOf(l){if(!Array.isArray(S.acc[l]))S.acc[l]=[];return S.acc[l]}
function splitN(V,w,n,lo,hi){
 n=Math.max(1,Math.round(+n||2));lo=Math.max(1,Math.round(+lo||6));hi=Math.max(lo,Math.round(+hi||10));
 const unit=w>0?w:1,mid=Math.round((lo+hi)/2);
 let tot=V==null?n*mid:Math.floor(V/unit)+1;
 tot=Math.min(n*hi,Math.max(n*lo,tot));
 const base=Math.floor(tot/n),rem=tot%n;
 return Array.from({length:n},(_,i)=>base+(i<rem?1:0));
}
function rangeMove(rs,lo,hi){
 if(rs.length&&rs.every(r=>+r>=+hi)) return 'up';
 if(rs.some(r=>+r<+lo)) return 'down';
 return 'hold';
}
function minRep(c){
 if((c.k==='acc'||c.k==='supp')&&c.lo!=null&&c.hi!=null&&+c.hi>+c.lo) return +c.lo;
 return +c.t;
}
function loggedMade(c){
 if(c.ok===true||c.ok===false) return c.ok;
 return c.r!=null && +c.r>=+c.t;
}
function planAcc(name,sets,lo,hi){
 sets=Math.max(1,Math.round(+sets||2));lo=Math.max(1,Math.round(+lo||6));hi=Math.max(lo,Math.round(+hi||10));
 const st=+S.step||2.5,g=lastAcc(name.toLowerCase()),mid=Math.round((lo+hi)/2);
 if(!g)return{w:0,t:Array(sets).fill(mid),V:null,lo,hi,note:`<b>First time:</b> enter the weight you use (0 = bodyweight). Target ${sets} × ${lo}–${hi}.`};
 const w=g[0].w,rs=g.map(x=>x.r),V=g.reduce((a,x)=>a+(x.w>0?x.w:1)*x.r,0);
 let nw=w,why='Same weight';
 const mv=rangeMove(rs,lo,hi);if(mv==='up'){nw=w+st;why='All sets at '+hi+' → heavier'}
 else if(mv==='down'&&w>0){nw=Math.max(0,Math.round(w*.925/st)*st);why='Below the '+lo+'–'+hi+' range → lighter'}
 const t=splitN(V,nw,sets,lo,hi);
 return{w:nw,t,V,lo,hi,note:`Last time: ${w>0?fmt(w)+' kg':'bw'} × ${rs.join(', ')}. ${why}.<br><b>Target: ${nw>0?fmt(nw)+' kg':'bw'} × ${t.join(' + ')}</b>`};
}
function planSupp(l,label,bw,t,range){
 const st=+S.step||2.5;
 for(let i=S.hist.length-1;i>=0;i--){const h=S.hist[i];if(h.lift!==l||h.partial)continue;
  const g=h.sets.filter(c=>c.k==='supp'&&c.label===label&&c.r!=null);
  if(!g.length)continue;
  const lw=g[0].w,rs=g.map(c=>c.r);let nw=lw,why='Same weight';
  const loR=g[0].lo!=null?+g[0].lo:(range&&range.lo!=null?+range.lo:null);
  const hiR=g[0].hi!=null?+g[0].hi:(range&&range.hi!=null?+range.hi:null);
  if(loR!=null&&hiR!=null&&hiR>loR){
   const mv=rangeMove(rs,loR,hiR);
   if(mv==='up'){nw=lw+st;why='All sets at '+hiR+' → heavier'}
   else if(mv==='down'&&lw>st){nw=lw-st;why='Under '+loR+' → lighter'}
  } else if(rs.every(r=>+r>=+t)){nw=lw+st;why='All sets on target → heavier'}
  else if(rs.some(r=>+r<+t-2)&&lw>st){nw=lw-st;why='Too far below target → a bit lighter'}
  return{w:nw,note:`Last time: ${fmt(lw)} kg × ${rs.join(', ')}. ${why}.`}}
 return{w:bw,note:null};
}
function accCards(ex){
 const name=typeof ex==='string'?ex:ex.name,sets=typeof ex==='string'?2:(+ex.sets||2),lo=typeof ex==='string'?6:(+ex.lo||6),hi=typeof ex==='string'?10:(+ex.hi||10);
 const p=planAcc(name,sets,lo,hi);
 return p.t.map((t,i)=>({k:'acc',label:name,w:p.w,t,n:i+1,of:p.t.length,V:p.V,lo:p.lo,hi:p.hi,note:p.note,r:null}));
}

const SUPP={
 none:{t:'None',how:'Nothing extra after the main sets. You go straight to accessories.'},
 bbb:{t:'BBB 5×10',sets:5,reps:10,pct:50,how:'<b>Boring But Big.</b> Five sets of 10 on the same lift, starting near 50% of your training max. It is the size template: a lot of clean reps, not a max-out. If you hit every set, the weight can creep up next time.'},
 bbb3:{t:'BBB 3×10',sets:3,reps:10,pct:50,how:'<b>BBB 3×10.</b> Three sets of 10 near 50% of your training max. Same light idea as 5×10, with fewer sets.'},
 bbbf:{t:'BBB at first set',sets:5,reps:10,which:0,how:'<b>BBB at the first set.</b> Five sets of 10 at the same load as your first work set that day, not the lighter 50% version.'},

function withWeek(w,fn){const prev=S.week;S.week=w;try{return fn()}finally{S.week=prev}}

function packSets(list){

 if(list.length>1&&list.every(s=>s===list[0])){const m=/^×(.+) @ (\d+(?:\.\d+)?)%$/.exec(list[0]);if(m)return [list.length+'×'+m[1]+' @ '+m[2]+'%']}

   case 'pyr':{
    const mode=modeId();let wave;
    if(w===4)wave=S.hiDel?[[70,5],[80,3],[90,1],[100,1]]:[[40,5],[50,5],[60,5]];
    else if(mode==='std')wave=WEEKS[w].map(x=>[x[0],x[1]]);
    else if(mode==='r351')wave=WEEKS[w===1?2:w===2?1:3].map(x=>[x[0],S.pro5?5:x[1]]);

    else if(mode==='none')wave=WEEKS[w].map(x=>[x[0],x[1]]);

    const down=wave.slice(0,-1).reverse();if(!down.length)return [];

   }

   case 'bbbw': if(w===4)return [];{const spec=w===1?[65,10]:w===2?[70,8]:[75,5];return Array.from({length:5},()=>fmtSet(spec[0],spec[1],false))}
   case 'r10':{const p=pctOf('last');return [5,3,2].map(r=>fmtSet(p,r,false))}

   case 'bbb55':
   case 'bbb53':
   case 'bbb51':
   case 'fsl':
   case 'ssl':
   case 'bbs':
   case 'widow':
   case 'gvt':
   case 'r50':{const spec=SUPP[id];if(spec.skip4&&w===4)return [];const pct=spec.pct!=null?spec.pct:pctOf(spec.which||0);return Array.from({length:spec.sets},()=>fmtSet(pct,spec.reps,false))}

  }

function plusCall(id){

 for(let w=1;w<=3;w++){
  const s=findSess(id,w,S.cycle);
  const mains=(!s||s.partial)?[]:(s.sets||[]).filter(c=>c.k==='main'&&c.r!=null);
  if(!mains.length){ok=false;weeks.push({w,kind:'none'});continue}
  const plus=mains.filter(c=>c.amrap);
  const use=plus.length?plus:mains;
  let hit=use.every(loggedMade);
  if(!plus.length){
   const need=withWeek(w,()=>workRows().length);
   if(mains.length<need) hit=false;
  }
  if(!hit) ok=false;
  const short=use.find(c=>!loggedMade(c));
  const show=short||use[use.length-1];
  let sub=show.r+'/'+show.t;
  if(!plus.length&&!short){
   const need=withWeek(w,()=>workRows().length);
   if(mains.length<need) sub=mains.length+'/'+need;
  }
  weeks.push({w,kind:hit?'hit':'bad',txt:(show.w>0?fmt(show.w)+'×':'×')+show.r,sub});
 }
 return {ok,weeks};
}

function parseCsv(text){

 if(!text.trim())return null;
 const first=(text.split('\n',1)[0]||'');
 const delim=(first.split(';').length>first.split(',').length)?';':',';
 const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;
  else if(c===delim){row.push(cur);cur=''}
  else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}

 }
 if(cur.length||row.length){row.push(cur);rows.push(row)}
 if(!rows.length)return null;
 const head=rows[0].map(h=>h.trim());
 if(!head.includes('type'))return null;
 return rows.slice(1).filter(r=>r.some(x=>String(x).trim()!=='')).map(r=>{const o={};head.forEach((h,i)=>{o[h]=r[i]==null?'':r[i]});return o});

  case 'axdel':{const list=accOf(v),i=+b.dataset.i;if(i>=0)list.splice(i,1);save();render();break}
  case 'addx':adding=!adding;render();if(adding)setTimeout(()=>{const i=$('#addx'),c=i&&i.closest('.addcard');if(i)i.focus();if(c)c.scrollIntoView({block:'center'})},50);break;
  case 'addgo':{const nm=exName($('#addx').value),sets=Math.max(1,Math.round(+$('#adds').value||3)),lo=Math.max(1,Math.round(+$('#addlo').value||8)),hi=Math.max(lo,Math.round(+$('#addhi').value||12));adding=false;
   if(nm){const ex={name:nm,sets,lo,hi};const day=dayById(W.lift);if(day){if(!Array.isArray(day.ex))day.ex=[];day.ex.push(ex)}else accOf(W.lift).push(ex);W.cards.push(...accCards(ex));ui={i:-1};enter=true;save()}
   render();break}
  case 'editset':{const i=+b.dataset.i,c=W&&W.cards[i];if(!c||c.r==null)break;edit={i,w:+c.w||0,r:+c.r||0,ok:!!c.ok};render();break}
  case 'editx':edit=null;render();break;
  case 'edw':if(edit){const st=+S.step||2.5;edit.w=Math.max(0,Math.round((edit.w+(+b.dataset.d||0)*st)*100)/100);render()}break;
  case 'edr':if(edit){edit.r=Math.max(0,(+edit.r||0)+(+b.dataset.d||0));render()}break;
  case 'edok':if(edit){edit.ok=b.dataset.d==='1';render()}break;
  case 'edsave':commitEdit();break;
  case 'undo':{
   if(!W)break;
   let i=+b.dataset.i;
   if(!(i>=0)||!W.cards[i]||W.cards[i].r==null)i=W.cards.map(c=>c.r!==null).lastIndexOf(true);
   if(i>=0){W.cards[i].r=null;W.cards=W.cards.filter((c,j)=>!(j>i&&c.k==='joker'&&c.r===null));if(!W.cards.some(c=>c.r!=null)){W.secs=0;W.tickAt=null;W.frozen=0;S.hist=S.hist.filter(s=>!(s.lift===W.lift&&+s.week===+W.week&&+s.cycle===+W.cycle))}else{W.frozen=0;W.tickAt=Date.now();saveSess(W,false)}edit=null;ui={i:-1};save();render()}
   break}
  case 'finish':{
   if(!W)break;
   if(W.review){S.workout=null;save();view='home';render();break}
   poke();W.frozen=1;
   if(W.cards.some(c=>c.r!=null))saveSess(W,true);
   S.workout=null;placeWeek();save();view='home';render();window.scrollTo(0,0);break}
  case 'early':{
   if(!W||W.review)break;
   if(!arm('early'))return;
   armed=null;
   poke();W.frozen=1;
   if(W.cards.some(c=>c.r!=null))saveSess(W,true);
   S.workout=null;placeWeek();save();view='home';render();window.scrollTo(0,0);break}
 }
});

document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.day){const d=dayById(t.dataset.day);if(!d)return;d.name=String(t.value||'').trim().replace(/\s+/g,' ');t.value=d.name;save();render();return}
 if(t.dataset.dx&&t.dataset.k==='name'){const d=dayById(t.dataset.dx),ex=d&&d.ex&&d.ex[+t.dataset.i];if(!ex)return;ex.name=exName(t.value);t.value=ex.name;save();return}
 if(t.dataset.ax&&t.dataset.k==='name'){const list=accOf(t.dataset.ax),ex=list[+t.dataset.i];if(!ex)return;ex.name=exName(t.value);t.value=ex.name;save();return}
 if(t.id==='csvfile'){const f=t.files&&t.files[0];t.value='';if(!f)return;const reader=new FileReader();reader.onload=()=>{try{importBackup(String(reader.result||''))}catch(err){ioMsg='Could not read that file. Use a backup CSV from this page.';view='hist';render()}};reader.readAsText(f);return}
 if(t.dataset.sel==='supp'&&SUPP[t.value]){S.supp=t.value;save();render();return}
 if(t.dataset.sel==='main'&&MAIN[t.value]){S.main=t.value;save();render();return}
 if(t.dataset.w!==undefined&&S.workout){setW(ui.i,parseFloat(String(t.value).replace(',','.'))||0);render()}});

document.addEventListener('input',e=>{
 const t=e.target,v=parseFloat(String(t.value).replace(',','.')),up=()=>LIFTS.forEach(L=>{const el=$('#tm_'+L.id);if(el)el.textContent='Training max '+fmt(tm(L.id))+' kg'});
 if(t.dataset.day){const d=dayById(t.dataset.day);if(d){d.name=t.value;save()}return}
 if(t.dataset.rm){if(!isNaN(v)){S.rm[t.dataset.rm]=v;save();up()}}
 else if(t.dataset.f){if(!isNaN(v)&&v>0){S[t.dataset.f]=v;save();up()}}
 else if(t.dataset.dx){const d=dayById(t.dataset.dx);if(!d||!Array.isArray(d.ex))return;const i=+t.dataset.i,k=t.dataset.k,ex=d.ex[i];if(!ex)return;
  if(k==='name')ex.name=t.value;else{const n=parseFloat(String(t.value).replace(',','.'));if(!isNaN(n)&&n>0){ex[k]=Math.round(n);if(ex.hi<ex.lo)ex.hi=ex.lo}}save()}
 else if(t.dataset.ax){const list=accOf(t.dataset.ax),i=+t.dataset.i,k=t.dataset.k,ex=list[i];if(!ex)return;
  if(k==='name')ex.name=t.value;else{const n=parseFloat(String(t.value).replace(',','.'));if(!isNaN(n)&&n>0){ex[k]=Math.round(n);if(ex.hi<ex.lo)ex.hi=ex.lo}}save()}
});

const mm=x=>{x=Math.max(0,Math.floor(x));return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
function clock(sec){sec=Math.max(0,Math.floor(+sec||0));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):m+':'+String(s).padStart(2,'0')}
function poke(){
 const W=S.workout;if(!W)return 0;
 if(W.review||W.frozen)return +W.secs||0;
 if(!W.cards||!W.cards.some(c=>c.r!=null)){W.secs=0;W.tickAt=null;return 0}
 const now=Date.now();
 if(!W.tickAt){W.tickAt=now;return +W.secs||0}
 const gap=(now-W.tickAt)/1000;
 if(gap>0)W.secs=(+W.secs||0)+gap;
 W.tickAt=now;
 return W.secs||0;
}
function tick(){
 const W=S.workout;if(!W)return;
 poke();
 if(view!=='work')return;
 const t=$('#tm'),rb=$('#rb'),rt=$('#rt');
 if(t)t.textContent=clock(W.secs||0);
 if(!W._sv||Date.now()-W._sv>15000){W._sv=Date.now();save()}
 if(!W.last)return;
 const cur=W.cards.findIndex(c=>c.r==null),prev=cur>0?W.cards[cur-1]:null,now=cur>=0?W.cards[cur]:null;
 const rp=prev&&now&&prev.label===SUPP.fslrp.t&&now.label===SUPP.fslrp.t;
 const el=(Date.now()-W.last)/1000,R=rp?20:Math.max(.1,+S.rest||2)*60;
 if(rb)rb.style.width=Math.min(1,el/R)*100+'%';
 if(rt){rt.textContent=el>=R?'Rest done':'Rest '+mm(R-el);rt.classList.toggle('rdy',el>=R)}
 if(el>=R&&!buzzed){buzzed=true;try{navigator.vibrate&&navigator.vibrate(250)}catch(e){}}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.workout){poke();save()}});
setInterval(tick,1000);
function migrate(){
 if(!SUPP[S.supp])S.supp='bbb';
 if(!MAIN[S.main])S.main='std';
 if(typeof S.dyn!=='boolean')S.dyn=false;
 if(typeof S.jkPair!=='boolean')S.jkPair=false;
 if(typeof S.hiDel!=='boolean')S.hiDel=false;
 if(typeof S.noSupp4!=='boolean')S.noSupp4=false;
 S.days=normDays(S.days);
}
migrate();
placeWeek();
backfillCycles();
if(S.workout&&S.workout.cards)view='work';
save();
render();
</script>
